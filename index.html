<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cantieri e viabilità – Comune di Castellanza</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header class="head">
    <p class="kicker">Comune di Castellanza · Viabilità</p>
    <h1 id="titolo">Lavori sulla rete dell’acqua</h1>
    <p class="sub" id="sottotitolo"></p>
    <p class="stamp"><span class="dot" aria-hidden="true"></span><span id="stamp">Caricamento…</span></p>
  </header>

  <section class="oggi" id="oggi" hidden>
    <h2>La situazione di oggi</h2>
    <div id="oggiTesto"></div>
  </section>

  <section id="evidenza" class="evidenza"></section>

  <section class="mappa-box" id="mappaBox">
    <h2>Dove sono i cantieri</h2>
    <div id="map" role="region" aria-label="Mappa dei cantieri"></div>
    <p class="nota" id="notaMappa"></p>
    <ul class="legenda" id="legenda"></ul>
    <div id="percorsi" class="percorsi"></div>
  </section>

  <section>
    <h2>Tutti gli aggiornamenti</h2>
    <div class="filtro">
      <label for="filtroTratto">Mostra</label>
      <select id="filtroTratto"><option value="">Tutte le strade</option></select>
    </div>
    <div id="lista" class="lista"></div>
  </section>

  <footer class="foot" id="contatti"></footer>
</main>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
